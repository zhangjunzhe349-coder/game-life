<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<meta name="description" content="Game Life · 把人生当成游戏来打：人物立绘 / 生理追踪 / 属性面板 / 技能成长 / 生命刻度">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Life">
<title>Game Life · 人生游戏面板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="atmo" aria-hidden="true"></div>
<div class="grid-lines" aria-hidden="true"></div>
<div class="scan" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo">GAME<em>·</em>LIFE</div>
      <div class="tagline">人生游戏面板</div>
    </div>
    <nav class="tabs" id="tabs" aria-label="主导航">
      <button class="tab active" data-tab="hud"><span class="ico">⚡</span><span>总览</span></button>
      <button class="tab" data-tab="skills"><span class="ico">🎯</span><span>技能</span></button>
      <button class="tab" data-tab="life"><span class="ico">⏳</span><span>生命</span></button>
      <button class="tab" data-tab="settings"><span class="ico">⚙️</span><span>设置</span></button>
    </nav>
    <div class="side-foot">
      LOCAL-FIRST<br><b>数据存于本机 · 自主可控</b>
    </div>
  </aside>

  <main id="main">

    <!-- ========== 总览：以 人物立绘为中心的 HUD ========== -->
    <section class="panel" id="panel-hud">
      <header class="hud-bar rv" data-d="1">
        <div class="who">
          <div class="lv-badge"><b id="hud-lv">1</b><span>LV</span></div>
          <h1 class="hud-title">角色状态<small>character status</small></h1>
        </div>
        <div class="readouts" id="hud-readouts"></div>
      </header>

      <div class="hud">
        <!-- 左翼：属性面板 -->
        <section class="wing rv" data-d="2" id="wing-attrs" aria-label="属性面板"></section>

        <!-- 中央：人物立绘舞台 -->
        <section class="stage-col rv" data-d="3">
          <div class="stage" id="stage">
            <svg id="portrait-svg" viewBox="0 0 680 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-label="人物立绘"></svg>
            <div class="stage-tag" aria-hidden="true">
              <span>CHARACTER <b>PORTRAIT</b></span>
              <span>分层立绘 · 随体型 / 衣橱实时变化</span>
            </div>
            <div class="stage-base" id="stage-base" aria-hidden="true"></div>
          </div>
          <div class="ctrl-toggle">
            <button class="btn mini" id="ctrl-toggle" aria-expanded="false">🎚 体型与衣橱</button>
          </div>
          <div id="avatar-ctrl" hidden></div>
        </section>

        <!-- 右翼：生理状态 -->
        <section class="wing rv" data-d="4" id="wing-body" aria-label="生理状态"></section>
      </div>
    </section>

    <section class="panel" id="panel-skills" hidden></section>
    <section class="panel" id="panel-life" hidden></section>
    <section class="panel" id="panel-settings" hidden></section>

  </main>
</div>

<div id="toast-box" aria-live="polite"></div>

<script src="js/storage.js"></script>
<script src="js/portrait.js"></script>
<script src="js/physiology.js"></script>
<script src="js/attributes.js"></script>
<script src="js/skills.js"></script>
<script src="js/life.js"></script>
<script src="js/app.js"></script>
</body>
</html>
