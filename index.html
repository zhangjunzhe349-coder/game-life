<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<meta name="description" content="Game Life · 把人生当成游戏来打：个人信息 / 生理追踪 / 属性面板 / 技能成长 / 生命刻度 / 电子衣橱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Game Life">
<title>Game Life · 人生游戏面板</title>
<!-- 字体已自托管到 css/style.css 的 @font-face：Google Fonts 在国内不可达，且 <link rel="stylesheet"> 会阻塞首屏 -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="atmo" aria-hidden="true"></div>
<div class="grid-lines" aria-hidden="true"></div>
<div class="scan" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo">GAME<em>·</em>LIFE</div>
      <div class="tagline">人生游戏面板</div>
    </div>
    <nav class="tabs" id="tabs" aria-label="主导航">
      <button class="tab active" data-tab="hud"><span class="ico">⚡</span><span>总览</span></button>
      <button class="tab" data-tab="skills"><span class="ico">🎯</span><span>技能</span></button>
      <button class="tab" data-tab="life"><span class="ico">⏳</span><span>生命</span></button>
      <button class="tab" data-tab="settings"><span class="ico">⚙️</span><span>设置</span></button>
    </nav>
    <div class="side-foot">
      LOCAL-FIRST<br><b>数据存于本机 · 自主可控</b>
    </div>
  </aside>

  <main id="main">

    <!-- ========== 总览：角色状态 HUD（v1.8.1 起中央立绘已移除） ========== -->
    <section class="panel" id="panel-hud">
      <header class="hud-bar rv" data-d="1">
        <div class="who">
          <div class="lv-badge"><b id="hud-lv">1</b><span>LV</span></div>
          <h1 class="hud-title">角色状态<small>character status</small></h1>
        </div>
        <div class="readouts" id="hud-readouts"></div>
      </header>

      <!-- 个人信息：顶替原立绘位，只占一条（身高 / 体重 / 肌肉量 / 发型，可直接改） -->
      <section class="profile rv" data-d="2" id="profile-card" aria-label="个人信息"></section>

      <div class="hud">
        <!-- 左翼：属性面板 -->
        <section class="wing rv" data-d="3" id="wing-attrs" aria-label="属性面板"></section>

        <!-- 右翼：生理状态 -->
        <section class="wing rv" data-d="4" id="wing-body" aria-label="生理状态"></section>
      </div>

      <!-- 电子衣橱：原先挂在立绘下方，立绘移除后改为整宽展开（卡片网格需要横向空间） -->
      <div class="wardrobe-block rv" data-d="5">
        <div class="ctrl-toggle">
          <button class="btn mini" id="ctrl-toggle" aria-expanded="false">👗 电子衣橱</button>
        </div>
        <div id="avatar-panel" hidden>
          <div id="wardrobe-ctrl"></div>
        </div>
      </div>
    </section>

    <section class="panel" id="panel-skills" hidden></section>
    <section class="panel" id="panel-life" hidden></section>
    <section class="panel" id="panel-settings" hidden></section>

  </main>
</div>

<div id="toast-box" aria-live="polite"></div>

<script src="js/storage.js"></script>
<script src="js/wardrobe-data.js"></script>
<script src="js/avatar.js"></script>
<script src="js/wardrobe.js"></script>
<script src="js/physiology.js"></script>
<script src="js/attributes.js"></script>
<script src="js/skills.js"></script>
<script src="js/life.js"></script>
<script src="js/app.js"></script>
</body>
</html>
